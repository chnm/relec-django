<div class="comparison-source-heading comparison-source-heading-{{ side }}">
  {% if source %}
    <div class="text-sm font-semibold text-gray-800 dark:text-gray-100">
      <span class="source-dot source-dot-{{ side }}"></span>
      {{ source.heading }}
    </div>
    <div class="mt-1 text-xs text-gray-500 dark:text-gray-400">
      {{ source.subtitle }}
    </div>
    {% if source.detail %}
      <div class="mt-1 text-xs text-gray-500 dark:text-gray-400">
        {{ source.detail }}
      </div>
    {% endif %}
    {% if source.job %}
      <div class="mt-1 text-xs text-gray-500 dark:text-gray-400">
        {{ source.job.total_input_tokens|default:0 }} input ·
        {{ source.job.output_tokens|default:0 }} output tokens
      </div>
    {% endif %}
  {% else %}
    <div class="text-sm text-gray-500 dark:text-gray-400">
      <span class="source-dot source-dot-{{ side }}"></span>
      {{ fallback }}
    </div>
  {% endif %}
</div>
