---
name: religious_ecologies

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    image: "rrchnm/relec-django"
    # StageX base images are amd64-only; Apple Silicon builds and runs this under emulation.
    platform: linux/amd64
    ports:
      - 8000:8000
    volumes:
      - dj-data:/app
      #- .:/app
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=thisisnotasecretkey
      - DJANGO_ALLOWED_HOSTS=localhost
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=religious_ecologies
      - DB_USER=religious_ecologies
      - DB_PASS=password
      - OBJ_STORAGE=False
      - MEMCACHED_URL=memcached:11211
      - APPLICATION_REVISION=${APPLICATION_REVISION:-}
      - CLAUDE_TRANSCRIPTION_ENABLED=${CLAUDE_TRANSCRIPTION_ENABLED:-False}
      - CLAUDE_TRANSCRIPTION_LARGE_RUN_THRESHOLD=${CLAUDE_TRANSCRIPTION_LARGE_RUN_THRESHOLD:-100}
      - CLAUDE_TRANSCRIPTION_MAX_RUN_JOBS=${CLAUDE_TRANSCRIPTION_MAX_RUN_JOBS:-10000}
      - CLAUDE_TRANSCRIPTION_PRICING
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health/', timeout=4).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
  transcription-worker:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    image: "rrchnm/relec-django"
    # StageX base images are amd64-only; Apple Silicon builds and runs this under emulation.
    platform: linux/amd64
    restart: unless-stopped
    profiles: ["transcription"]
    volumes:
      - dj-data:/app
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=thisisnotasecretkey
      - DJANGO_ALLOWED_HOSTS=localhost
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=religious_ecologies
      - DB_USER=religious_ecologies
      - DB_PASS=password
      - OBJ_STORAGE=False
      - MEMCACHED_URL=memcached:11211
      - APPLICATION_REVISION=${APPLICATION_REVISION:-}
      - CLAUDE_TRANSCRIPTION_ENABLED=${CLAUDE_TRANSCRIPTION_ENABLED:-False}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    command: python manage.py run_transcription_worker --idle-when-disabled
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; p='/tmp/transcription-worker-alive'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 600 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      app:
        condition: service_healthy
  memcached:
    image: memcached:1-alpine
    restart: unless-stopped
  db:
    # The production Postgres image (rrchnm-systems/k8s-django components/postgres).
    image: docker.io/pgautoupgrade/pgautoupgrade@sha256:9892fd41b60f12d8a3d0272ce40f4d8f745184e82b03e7fe310ef98d8a29080c
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=religious_ecologies
      - POSTGRES_USER=religious_ecologies
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U religious_ecologies"]
      interval: 2s
      timeout: 5s
      retries: 3

volumes:
  dj-data:
  pg-data:
