---
name: religious_ecologies

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    image: "rrchnm/relec-django"
    labels:
      - autoheal=true
    ports:
      - 8000:8000
    volumes:
      - dj-data:/app
      #- .:/app
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=thisisnotasecretkey
      - DJANGO_ALLOWED_HOSTS=localhost
      - DJANGO_CSRF_TRUSTED_ORIGINS=http://localhost
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=religious_ecologies
      - DB_USER=religious_ecologies
      - DB_PASS=password
      - OBJ_STORAGE=True
      - OBJ_STORAGE_ACCESS_KEY_ID=PLACEHOLDER
      - OBJ_STORAGE_SECRET_ACCESS_KEY=PLACEHOLDER
      - OBJ_STORAGE_BUCKET_NAME=PLACEHOLDER
      - OBJ_STORAGE_ENDPOINT_URL=https://dev.obj.rrchnm.org
      - MEMCACHED_URL=memcached:11211
      - APPLICATION_REVISION=${APPLICATION_REVISION:-}
    command: >
      sh -c "uv run manage.py migrate &&
             uv run manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy
      memcached:
        condition: service_started
  transcription-worker:
    build:
      context: .
      dockerfile: Dockerfile
      no_cache: true
    image: "rrchnm/relec-django"
    restart: unless-stopped
    labels:
      - autoheal=true
    profiles: ["transcription"]
    volumes:
      - dj-data:/app
    environment:
      - DEBUG=True
      - DJANGO_SECRET_KEY=thisisnotasecretkey
      - DJANGO_ALLOWED_HOSTS=localhost
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=religious_ecologies
      - DB_USER=religious_ecologies
      - DB_PASS=password
      - OBJ_STORAGE=True
      - OBJ_STORAGE_ACCESS_KEY_ID=PLACEHOLDER
      - OBJ_STORAGE_SECRET_ACCESS_KEY=PLACEHOLDER
      - OBJ_STORAGE_BUCKET_NAME=PLACEHOLDER
      - OBJ_STORAGE_ENDPOINT_URL=https://dev.obj.rrchnm.org
      - MEMCACHED_URL=memcached:11211
      - APPLICATION_REVISION=${APPLICATION_REVISION:-}
      - CLAUDE_TRANSCRIPTION_ENABLED=${CLAUDE_TRANSCRIPTION_ENABLED:-False}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    command: uv run manage.py run_transcription_worker --idle-when-disabled
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os,sys,time; p='/tmp/transcription-worker-alive'; sys.exit(0 if os.path.exists(p) and time.time() - os.path.getmtime(p) < 600 else 1)"
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s
    depends_on:
      app:
        condition: service_healthy
  memcached:
    image: memcached:1-alpine
    restart: unless-stopped
  db:
    image: postgres:17
    volumes:
      - pg-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=religious_ecologies
      - POSTGRES_USER=religious_ecologies
      - POSTGRES_PASSWORD=password
      - POSTGRES_HOST=db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U religious_ecologies"]
      interval: 2s
      timeout: 5s
      retries: 3

  autoheal:
    image: willfarrell/autoheal:1.2.0
    restart: unless-stopped
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
    volumes:
      - ${DOCKER_SOCK:-/var/run/docker.sock}:/var/run/docker.sock

volumes:
  dj-data:
  pg-data:
