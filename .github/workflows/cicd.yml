name: Django CI and k0s deployment

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: [k8s/kustomization.yaml]
  pull_request:
    branches: [main, preview]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deployment:
    permissions:
      contents: write   # the reusable pins the digest back to this repository
    uses: chnm/.github/.github/workflows/django--k0s.yml@6e731b92c14048272c279f929cf86306240510c8 # pinned; bump deliberately
    with:
      image: rrchnm/relec-django
      # Argo CD tracks main. Pull requests (into main or preview) only build.
      ref: main
    secrets:
      ZOT_TOKEN: ${{ secrets.ZOT_TOKEN }}
