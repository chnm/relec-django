[project]
name = "religious_ecologies"
version = "0.1.0"
description = "Religious Ecologies: Django project for the Religious Ecologies project."
authors = [
    {name = "Jason Heppler", email = "jheppler@gmu.edu"}
]
license = {text = "Mozilla Public License"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.2.2",
    "daphne>=4.2.2",
    "whitenoise>=6.12.0",
    "django>=6.0.6",
    "django-environ>=0.14.0",
    "django-tailwind>=4.5.0",
    "django-storages>=1.14.6",
    "boto3>=1.43.38",
    "django-unfold>=0.99.0",
    "django-simple-history>=3.12.0",
    "requests>=2.34.2",
    "django-dbml>=1.1.2",
    "pillow>=12.3.0",
    "easy-thumbnails>=2.10.1",
    "djangorestframework>=3.17.1",
    "django-filter>=25.2",
    "psycopg2-binary>=2.9.12",
    "markdown>=3.10.2",
    "django-import-export>=4.4.1",
    "openpyxl>=3.1.5",
    "django-tables2>=3.0.0",
    "django-cors-headers>=4.9.0",
    "pymemcache>=4.0.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "djhtml>=3.0.11",
    "pre-commit>=4.6.0",
    "pytest-django>=4.12.0",
    "pylint-django>=2.7.0",
    "factory-boy>=3.3.3",
    "django-debug-toolbar>=7.0.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

