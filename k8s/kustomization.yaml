apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: relec

resources:
- app-deploy.yaml
- netpol.yaml
- transcription-worker.yaml

# Shared Django deployment: https://forge.rrchnm.internal/rrchnm-systems/k8s-django
# Pinned by commit; bump every ref together. media-garage serves the Garage
# bucket (app-deploy MEDIA_BUCKET) same-origin at /media/.
components:
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/app?ref=33694f00607a0413ec9e60d665c5b445c875f4cb
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/postgres?ref=33694f00607a0413ec9e60d665c5b445c875f4cb
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/backup?ref=33694f00607a0413ec9e60d665c5b445c875f4cb
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/media-garage?ref=33694f00607a0413ec9e60d665c5b445c875f4cb

# This app's own Django settings (the components set DB_*, hosts and DEBUG).
# CLAUDE_TRANSCRIPTION_ENABLED is read by both the web pod (launches runs) and
# the worker (docs/AI_TRANSCRIPTION.md); ANTHROPIC_API_KEY comes from
# kv/eso/relec-django.
configMapGenerator:
- literals:
  - OBJ_STORAGE=True
  - OBJ_STORAGE_ENDPOINT_URL=http://obj.rrchnm.internal:3900
  - OBJ_STORAGE_REGION=rrchnm
  - OBJ_STORAGE_BUCKET_NAME=religiousecologies.org
  - CLAUDE_TRANSCRIPTION_ENABLED=True
  name: app-env
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"

# App resources, the migrate command, Postgres size (immutable after the first
# sync) and a backup slot clear of the other apps.
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: app }
    spec:
      template:
        spec:
          containers:
            - name: app
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 1Gi }
  target:
    kind: Deployment
    name: app
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/command
      value: ["sh", "-c", "python manage.py migrate --noinput && python manage.py setup_transcription_groups"]
  target:
    kind: Job
    name: migrate
- patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
      value: 10Gi
  target:
    kind: StatefulSet
    name: postgres
- patch: |-
    - op: replace
      path: /spec/schedule
      value: "15 3 * * *"
  target:
    kind: CronJob
    name: postgres-backup

# Copy the pinned digest into IMAGE_DIGEST. Must live here: replacements in
# components run before `images:` below.
replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=app].image
    kind: Deployment
    name: app
    options:
      delimiter: '@'
      index: 1
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=app].env.[name=IMAGE_DIGEST].value
    select:
      kind: Deployment
      name: app

# Two entries on purpose: `app` -> the real name, then the real name -> its
# digest. CI (chnm/.github update-deploy-digests) pins with
# `kustomize edit set image` and only updates an entry named after the real
# image. Keep that the only `digest:` line.
images:
- name: app
  newName: oci.rrchnm.internal/rrchnm/relec-django
- digest: sha256:b528949220d5d0258fe64d193b49500d5e156688b8a9bf86601ded2d7e4c4c62
  name: oci.rrchnm.internal/rrchnm/relec-django
