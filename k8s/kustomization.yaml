apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: relec

resources:
- app-deploy.yaml
- https-redirect.yaml
- netpol.yaml
- post-sync-health-check.yaml
- transcription-worker.yaml
- www-redirect.yaml

# Shared Django deployment: https://forge.rrchnm.internal/rrchnm-systems/k8s-django
# Pinned by commit; bump every ref together. media-garage serves the Garage
# bucket (app-deploy MEDIA_BUCKET) same-origin at /media/.
components:
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/app?ref=c3efe70804ed626b87b1bdfd4e59826357d82864
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/postgres?ref=c3efe70804ed626b87b1bdfd4e59826357d82864
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/backup?ref=c3efe70804ed626b87b1bdfd4e59826357d82864
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/media-garage?ref=c3efe70804ed626b87b1bdfd4e59826357d82864
- https://forge.rrchnm.internal/rrchnm-systems/k8s-django//components/developer-refresh?ref=c3efe70804ed626b87b1bdfd4e59826357d82864

# This app's own Django settings (the components set DB_*, hosts and DEBUG).
# CLAUDE_TRANSCRIPTION_ENABLED is read by both the web pod (launches runs) and
# the worker (docs/AI_TRANSCRIPTION.md); ANTHROPIC_API_KEY comes from
# kv/eso/relec-django.
configMapGenerator:
- literals:
  - OBJ_STORAGE=True
  - OBJ_STORAGE_ENDPOINT_URL=http://obj.rrchnm.internal:3900
  - OBJ_STORAGE_REGION=rrchnm
  - OBJ_STORAGE_BUCKET_NAME=religiousecologies.org
  - CLAUDE_TRANSCRIPTION_ENABLED=True
  name: app-env
  options:
    annotations:
      argocd.argoproj.io/sync-wave: "-2"

# Comments go here, never inside a `patch: |-` body or above a `- patch:`
# item: CI's `kustomize edit set image` copies `#` lines out of block scalars
# as new comments on every digest pin, and hoists item comments above
# `patches:`.
#
# App resources, the namespace memory budget, the migrate command, Postgres
# size (immutable after the first sync) and a backup slot clear of the other
# apps. The app's 2Gi limit: serializing a 5000-record religious-bodies API
# page costs ~300Mi, three Gunicorn workers can do that at once, and the
# in-process page cache keeps each response for an hour. The 6Gi quota: the
# shared 4Gi limits budget fits the steady state (app 2Gi + media 128Mi,
# postgres 1Gi, worker 512Mi) but not the rolling-update surge pod, which
# needs another 2.1Gi while the old pod drains.
patches:
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata: { name: app }
    spec:
      template:
        spec:
          containers:
            - name: app
              resources:
                requests: { cpu: 100m, memory: 256Mi }
                limits: { cpu: "1", memory: 2Gi }
  target:
    kind: Deployment
    name: app
- patch: |-
    apiVersion: v1
    kind: ResourceQuota
    metadata: { name: quota }
    spec:
      hard:
        limits.memory: 6Gi
  target:
    kind: ResourceQuota
    name: quota
- patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/command
      value: ["sh", "-c", "python manage.py migrate --noinput && python manage.py setup_transcription_groups"]
  target:
    kind: Job
    name: migrate
- patch: |-
    - op: replace
      path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
      value: 10Gi
  target:
    kind: StatefulSet
    name: postgres
- patch: |-
    - op: replace
      path: /spec/schedule
      value: "15 3 * * *"
  target:
    kind: CronJob
    name: postgres-backup

# Copy the pinned image into IMAGE_DIGEST and the developer copy's record.
# Must live here: replacements in components run before `images:` below.
replacements:
- source:
    fieldPath: spec.template.spec.containers.[name=app].image
    kind: Deployment
    name: app
    options:
      delimiter: '@'
      index: 1
  targets:
  - fieldPaths:
    - spec.template.spec.containers.[name=app].env.[name=IMAGE_DIGEST].value
    select:
      kind: Deployment
      name: app
- source:
    fieldPath: spec.template.spec.containers.[name=app].image
    kind: Deployment
    name: app
  targets:
  - fieldPaths:
    - spec.jobTemplate.spec.template.spec.containers.[name=swap].env.[name=APP_IMAGE].value
    select:
      kind: CronJob
      name: developer-refresh

# Two entries on purpose: `app` -> the real name, then the real name -> its
# digest. CI (chnm/.github update-deploy-digests) pins with
# `kustomize edit set image` and only updates an entry named after the real
# image. Keep that the only `digest:` line.
images:
- name: app
  newName: oci.rrchnm.internal/rrchnm/relec-django
- digest: sha256:5b0d1c8dcba46225a9d6b5cff9fe29571a27d92f4edefe15f3e86f2e983b2023
  name: oci.rrchnm.internal/rrchnm/relec-django
